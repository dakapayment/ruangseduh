<head>
  <meta charset="UTF-8">

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // SVG Icons
    const Coffee = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>);
    const ShoppingBag = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>);
    const Award = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 22 12 17 17 22 15.79 13.88"/></svg>);
    const Clock = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);
    const User = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>);
    const QrCode = ({ className = "w-5 h-5", size = 20 }) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="7" y1="7" x2="7.01" y2="7"/><line x1="18" y1="7" x2="18.01" y2="7"/><line x1="7" y1="18" x2="7.01" y2="18"/><line x1="18" y1="18" x2="18.01" y2="18"/></svg>);
    const Plus = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>);
    const Minus = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>);
    const Trash2 = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
    const Sun = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>);
    const Moon = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>);
    const ChevronRight = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>);
    const Gift = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>);
    const ShoppingCart = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>);
    const Sparkles = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>);
    const X = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);
    const Check = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);
    const Ticket = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 11v2"/><path d="M13 17v2"/></svg>);
    const LogOut = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>);
    const LogIn = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>);
    const UserCheck = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>);

    // INITIAL MENU
    const INITIAL_MENU = [
      { id: 'm1', name: 'Mocha Intenso', category: 'Coffee', price: 18000, desc: 'Perpaduan antara coklat premium dengan kopi robusta pilihan', image: 'https://images.bukaolshop.com/hosting/38154/08b5850b46db416355.png' },
      { id: 'm2', name: 'Kopi Gula Aren', category: 'Coffee', price: 15000, desc: 'Paduan espresso kaya rasa, susu creamy, dan gula aren organik spesial.', image: 'https://images.bukaolshop.com/hosting/38154/7962862d9d07489063.png' },
      { id: 'm3', name: 'Coffee Butterscotch', category: 'Coffee', price: 15000, desc: 'Coffee Butterscotch.', image: 'https://images.bukaolshop.com/hosting/38154/8dd5ab18c9b1471610.png' },
      { id: 'm9', name: 'Black Bee Coffee', category: 'Coffee', price: 15000, desc: 'Black Bee Coffee.', image: 'https://images.bukaolshop.com/hosting/38154/84a2312e5226802454.png' },
      { id: 'm4', name: 'Artisan Velvet Matcha', category: 'Non Coffee', price: 42000, desc: 'Matcha Uji Jepang kelas premium dipadukan dengan milk foam lembut.', image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=500&q=80' },
      { id: 'm5', name: 'Belgian Dark Chocolate', category: 'Non Coffee', price: 40000, desc: 'Cokelat hitam belgia kental hangat atau dingin dengan hint sea salt.', image: 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=500&q=80' },
      { id: 'm6', name: 'Sparkling Yuzu Blossom', category: 'Fresh Drink', price: 36000, desc: 'Perasan jeruk Yuzu asli, air soda, dan ekstrak bunga telang segar.', image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500&q=80' },
      { id: 'm7', name: 'Berry Hibiscus Cooler', category: 'Fresh Drink', price: 34000, desc: 'Teh hibiscus diseduh dingin bersama potongan stroberi segar dan mint.', image: 'https://images.unsplash.com/photo-1556881286-fc6915169721?w=500&q=80' },
      { id: 'm8', name: 'French Croissant Warm', category: 'Cemilan', price: 25000, desc: 'Roti croissant renyah dengan rasa mentega kaya yang hangat.', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500&q=80' },
    ];

    // =================================----------------------------
    // KATALOG POIN & REWARD (UBAH/TAMBAH MENU HADIAH DI SINI)
    // =================================----------------------------
    const INITIAL_REWARDS = [
      { id: 'r1', name: 'Voucher Diskon Rp 150.000', points: 15000, type: 'Voucher Diskon', desc: 'Potongan harga Rp 15.000 saat checkout', discountAmount: 15000 },
      { id: 'r2', name: 'Gratis 1 Ruang Seduh Latte', points: 35000, type: 'Gratis Minuman', desc: 'Voucher potongan Rp 38.000 untuk Latte', discountAmount: 38000 },
      { id: 'r3', name: 'Gantungan Kunci Tumbler Emas', points: 50000, type: 'Merchandise', desc: 'Edisi terbatas Ruang Seduh', discountAmount: 0 },
      { id: 'r4', name: 'Cashback Rp 50.000 Diskon', points: 45000, type: 'Voucher Diskon', desc: 'Potongan langsung Rp 50.000', discountAmount: 50000 },
    ];

    function App() {
      const SCRIPT_DATABASE_URL = 'https://script.google.com/macros/s/AKfycbz6yq-lrOJ9Nms8Q5ZYnOEFeNsj3UVO9idulhSrjZIE6kK173kT4_aF0zI5lWFZGystbw/exec';
      const TELEGRAM_TOKEN = '8993074889:AAHLq5-NSGZxJkEYE6meNnmUKt-kRPW32CE';
      const TELEGRAM_CHAT_ID = '6085581813';

      const [currentTab, setCurrentTab] = useState('home');
      const [darkMode, setDarkMode] = useState(false);

      const [authMode, setAuthMode] = useState('login'); 
      const [isLoadingAuth, setIsLoadingAuth] = useState(false);

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('rs_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('rs_orders_list');
        return saved ? JSON.parse(saved) : [];
      });

      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [menuItems] = useState(INITIAL_MENU);
      const [rewardsList] = useState(INITIAL_REWARDS);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('Semua');

      const [selectedProduct, setSelectedProduct] = useState(null);
      const [sugarLevel, setSugarLevel] = useState('Normal Sugar');
      const [orderNotes, setOrderNotes] = useState('');
      const [itemQty, setItemQty] = useState(1);
      
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [checkoutStep, setCheckoutStep] = useState('cart'); 
      const [selectedVoucher, setSelectedVoucher] = useState(null);
      const [showVoucherSelector, setShowVoucherSelector] = useState(false);

      const [activeOrderReceipt, setActiveOrderReceipt] = useState(null);
      const [scanQRInput, setScanQRInput] = useState('');
      const [qrModalOpen, setQrModalOpen] = useState(false);
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('rs_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('rs_current_user');
        }
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('rs_orders_list', JSON.stringify(orders));
      }, [orders]);

      // SINKRONISASI KE GOOGLE SHEETS
      const syncUserToSpreadsheet = async (updatedUser) => {
        try {
          await fetch(SCRIPT_DATABASE_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'updateUser',
              phone: updatedUser.phone,
              points: updatedUser.points,
              myVouchers: updatedUser.myVouchers,
              claimedQRs: updatedUser.claimedQRs
            })
          });
        } catch (err) {
          console.error('Gagal sync ke spreadsheet:', err);
        }
      };

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // LOGIN / REGISTER SPREADSHEET
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const phone = formData.get('phone').trim();
        const password = formData.get('password').trim();

        setIsLoadingAuth(true);

        try {
          if (authMode === 'register') {
            const name = formData.get('name').trim();
            const res = await fetch(SCRIPT_DATABASE_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'register', name, phone, password })
            });
            const result = await res.json();

            if (result.success) {
              setCurrentUser(result.user);
              showToast(`Pendaftaran berhasil! Welcome, ${result.user.name} 🎉`);
              setIsLoginModalOpen(false);
            } else {
              showToast(result.message, 'error');
            }
          } else {
            const res = await fetch(SCRIPT_DATABASE_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'login', phone, password })
            });
            const result = await res.json();

            if (result.success) {
              setCurrentUser(result.user);
              showToast(`Login Berhasil! Welcome back, ${result.user.name} 👋`);
              setIsLoginModalOpen(false);
            } else {
              showToast(result.message, 'error');
            }
          }
        } catch (error) {
          showToast('Gagal terhubung ke Database Spreadsheet', 'error');
        } finally {
          setIsLoadingAuth(false);
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedVoucher(null);
        showToast('Anda telah keluar dari akun.');
      };

      const memberLevel = useMemo(() => {
        const pts = currentUser ? currentUser.points : 0;
        if (pts >= 1000) return { name: 'Platinum', badge: 'bg-yellow-500 text-slate-900', color: 'from-amber-200 via-yellow-400 to-amber-600' };
        if (pts >= 500) return { name: 'Gold', badge: 'bg-amber-500 text-white', color: 'from-amber-400 to-yellow-600' };
        return { name: 'Silver', badge: 'bg-slate-400 text-white', color: 'from-slate-300 to-slate-400' };
      }, [currentUser]);

      const handleOpenDetail = (product) => {
        setSelectedProduct(product);
        setSugarLevel('Normal Sugar');
        setOrderNotes('');
        setItemQty(1);
      };

      const handleAddToCart = () => {
        if (!selectedProduct) return;
        const cartItem = {
          cartItemId: Date.now().toString(),
          productId: selectedProduct.id,
          name: selectedProduct.name,
          price: selectedProduct.price,
          image: selectedProduct.image,
          sugarLevel: sugarLevel,
          notes: orderNotes,
          qty: itemQty
        };

        setCart((prev) => {
          const existingIdx = prev.findIndex(
            i => i.productId === cartItem.productId && i.sugarLevel === cartItem.sugarLevel && i.notes === cartItem.notes
          );
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx].qty += itemQty;
            return updated;
          }
          return [...prev, cartItem];
        });

        setSelectedProduct(null);
        showToast(`${itemQty}x "${selectedProduct.name}" ditambahkan ke keranjang!`);
      };

      const updateCartQty = (cartItemId, delta) => {
        setCart((prev) => prev.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalCartCount = useMemo(() => cart.reduce((sum, item) => sum + item.qty, 0), [cart]);
      const subtotalCart = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.qty), 0), [cart]);

      const discountAmount = useMemo(() => {
        if (!selectedVoucher) return 0;
        return selectedVoucher.discountAmount || 0;
      }, [selectedVoucher]);

      const finalTotalAmount = useMemo(() => Math.max(0, subtotalCart - discountAmount), [subtotalCart, discountAmount]);

      const sendTelegramNotification = async (order) => {
        if (!TELEGRAM_TOKEN || !TELEGRAM_CHAT_ID) return;

        const itemsText = order.items.map(item => (
          `• *${item.qty}x ${item.name}*\n  _Gula: ${item.sugarLevel}_${item.notes ? `\n  _Catatan: ${item.notes}_` : ''}`
        )).join('\n');

        const message = `🚨 *PESANAN BARU RUANG SEDUH!* ☕\n\n` +
          `*No. Pesanan:* \`${order.orderNo}\`\n` +
          `*Nama:* ${order.customerName}\n` +
          `*No. HP:* ${order.customerPhone}\n` +
          `*Metode Bayar:* ${order.paymentMethod}\n\n` +
          `*Detail Minuman:*\n${itemsText}\n\n` +
          `-----------------------------------\n` +
          `*Subtotal:* Rp ${order.subtotal.toLocaleString('id-ID')}\n` +
          (order.discountAmount > 0 ? `*Diskon:* -Rp ${order.discountAmount.toLocaleString('id-ID')} (${order.appliedVoucher})\n` : '') +
          `*TOTAL:* *Rp ${order.totalAmount.toLocaleString('id-ID')}*\n` +
          `-----------------------------------\n` +
          `📌 *Status:* ${order.status}`;

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN.trim()}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID.trim(),
              text: message,
              parse_mode: 'Markdown'
            })
          });
        } catch (error) {
          console.error("Gagal mengirimkan notifikasi Telegram:", error);
        }
      };

      const handleProcessCheckout = async () => {
        if (cart.length === 0) return;

        if (!currentUser) {
          setIsCartOpen(false);
          setIsLoginModalOpen(true);
          showToast('Silakan login / daftar terlebih dahulu untuk checkout', 'error');
          return;
        }

        const orderNo = `RS-${Math.floor(100000 + Math.random() * 900000)}`;
        const qrReceiptCode = `QR-POINT-${orderNo}-${Date.now().toString().slice(-4)}`;
        const potentialPoints = Math.floor(finalTotalAmount / 1000);

        const newOrder = {
          orderNo, customerName: currentUser.name, customerPhone: currentUser.phone,
          items: cart, subtotal: subtotalCart, discountAmount, appliedVoucher: selectedVoucher ? selectedVoucher.name : null,
          totalAmount: finalTotalAmount, paymentMethod: 'Bayar di Kasir', status: 'Menunggu Konfirmasi',
          createdAt: new Date().toISOString(), qrReceiptCode, pointsEarned: potentialPoints, qrClaimed: false
        };

        if (selectedVoucher && selectedVoucher.id) {
          const updatedUser = {
            ...currentUser,
            myVouchers: (currentUser.myVouchers || []).filter(v => v.id !== selectedVoucher.id)
          };
          setCurrentUser(updatedUser);
          syncUserToSpreadsheet(updatedUser);
        }

        sendTelegramNotification(newOrder);

        setOrders((prev) => [newOrder, ...prev]);
        setActiveOrderReceipt(newOrder);
        setCart([]);
        setSelectedVoucher(null);
        setIsCartOpen(false);
        setCheckoutStep('cart');
        showToast(`Pesanan ${orderNo} berhasil dibuat! ☕`);
      };

      const handleClaimQR = (qrCodeToScan) => {
        if (!currentUser) {
          setIsLoginModalOpen(true);
          showToast('Silakan login terlebih dahulu untuk klaim poin', 'error');
          return;
        }

        const code = qrCodeToScan || scanQRInput;
        if (!code) return showToast('Masukkan kode QR struk terlebih dahulu', 'error');

        const targetOrderIndex = orders.findIndex(o => o.qrReceiptCode === code);
        if (targetOrderIndex === -1) return showToast('Kode QR Struk tidak valid!', 'error');

        const targetOrder = orders[targetOrderIndex];
        if (targetOrder.qrClaimed || (currentUser.claimedQRs && currentUser.claimedQRs.includes(code))) {
          return showToast('Kode QR ini sudah pernah dipindai!', 'error');
        }

        const earned = targetOrder.pointsEarned || Math.floor(targetOrder.totalAmount / 1000);
        const updatedUser = {

                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <LogIn className="w-5 h-5 text-[#0B8F5A]" />
                    {authMode === 'login' ? 'Login Member' : 'Daftar Member Baru'}
                  </h3>
                  <button type="button" onClick={() => setIsLoginModalOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                </div>

                {authMode === 'register' && (
                  <div>
                    <label className="text-xs font-bold block mb-1">Nama Lengkap *</label>
                    <input name="name" type="text" required placeholder="Contoh: Budi Santoso" className="w-full p-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none" />
                  </div>
                )}

                <div>
                  <label className="text-xs font-bold block mb-1">Nomor WhatsApp / HP *</label>
                  <input name="phone" type="tel" required placeholder="081234567890" className="w-full p-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-mono outline-none" />
                </div>

                <div>
                  <label className="text-xs font-bold block mb-1">Kata Sandi (Password) *</label>
                  <input name="password" type="password" required placeholder="******" className="w-full p-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none" />
                </div>

                <button type="submit" disabled={isLoadingAuth} className="w-full bg-[#0B8F5A] text-white py-3.5 rounded-xl font-bold text-xs shadow-lg transition flex justify-center">
                  {isLoadingAuth ? 'Memproses...' : authMode === 'login' ? 'Masuk Sesi' : 'Daftar & Dapatkan +100 Poin'}
                </button>

                <div className="text-center pt-2">
                  <button type="button" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-xs font-bold text-[#0B8F5A] hover:underline">
                    {authMode === 'login' ? 'Belum punya akun? Daftar Sekarang' : 'Sudah punya akun? Login di sini'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL DETAIL MINUMAN & PORSI */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="relative h-48">
                  <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-full object-cover" />
                  <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 bg-slate-900/70 text-white p-2 rounded-full"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 space-y-4">
                  <div><h3 className="text-xl font-bold">{selectedProduct.name}</h3><p className="text-xs text-slate-500 mt-1">{selectedProduct.desc}</p></div>

                  <div>
                    <label className="text-xs font-bold uppercase block mb-2 text-slate-500">Tingkat Gula</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['Normal Sugar', 'Low Sugar', 'Extra Sugar'].map(level => (
                        <button key={level} onClick={() => setSugarLevel(level)} className={`py-2 rounded-xl text-xs font-bold border transition ${sugarLevel === level ? 'bg-[#0B8F5A] text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>{level}</button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-bold uppercase block mb-1 text-slate-500">Catatan Pesanan</label>
                    <textarea value={orderNotes} onChange={(e) => setOrderNotes(e.target.value)} placeholder="Contoh: Es batu sedikit..." className="w-full bg-slate-50 dark:bg-slate-800 border p-2.5 rounded-xl text-xs outline-none" rows={2} />
                  </div>

                  <div className="flex items-center justify-between border-t border-b py-3">
                    <span className="text-xs font-bold uppercase text-slate-500">Jumlah Porsi</span>
                    <div className="flex items-center gap-3 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl border">
                      <button onClick={() => setItemQty(prev => Math.max(1, prev - 1))} className="w-8 h-8 rounded-xl bg-white dark:bg-slate-700 flex items-center justify-center font-bold"><Minus className="w-4 h-4" /></button>
                      <span className="font-extrabold text-sm w-6 text-center">{itemQty}</span>
                      <button onClick={() => setItemQty(prev => prev + 1)} className="w-8 h-8 rounded-xl bg-[#0B8F5A] text-white flex items-center justify-center font-bold"><Plus className="w-4 h-4" /></button>
                    </div>
                  </div>

                  <button onClick={handleAddToCart} className="w-full bg-[#0B8F5A] text-white py-3.5 rounded-xl font-bold text-xs shadow-lg flex items-center justify-between px-5">
                    <span>Tambah ke Keranjang ({itemQty} Porsi)</span>
                    <span className="font-black text-amber-300">Rp {(selectedProduct.price * itemQty).toLocaleString('id-ID')}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL KERANJANG & CHECKOUT */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-end sm:p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full sm:max-w-md h-full sm:h-[90vh] sm:rounded-3xl flex flex-col justify-between shadow-2xl overflow-hidden">
                <div className="p-4 border-b flex justify-between items-center"><h3 className="font-bold text-base">{checkoutStep === 'cart' ? 'Keranjang Belanja' : 'Checkout & Pembayaran'}</h3><button onClick={() => setIsCartOpen(false)} className="text-slate-400"><X className="w-5 h-5" /></button></div>

                <div className="p-4 flex-1 overflow-y-auto space-y-4">
                  {checkoutStep === 'cart' ? (
                    cart.length === 0 ? <p className="text-center py-20 text-slate-400 text-xs">Keranjang Anda masih kosong.</p> : (
                      cart.map(item => (
                        <div key={item.cartItemId} className="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-2xl flex justify-between items-center">
                          <div>
                            <h4 className="font-bold text-sm">{item.name}</h4>
                            <span className="text-[10px] text-amber-600 font-bold">{item.sugarLevel}</span>
                            {item.notes && <p className="text-[10px] text-slate-400 italic">"{item.notes}"</p>}
                            <p className="text-xs font-black text-[#0B8F5A] mt-0.5">Rp {(item.price * item.qty).toLocaleString('id-ID')}</p>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => updateCartQty(item.cartItemId, -1)} className="p-1 bg-slate-200 rounded"><Minus className="w-3.5 h-3.5" /></button>
                            <span className="text-xs font-bold px-1">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.cartItemId, 1)} className="p-1 bg-slate-200 rounded"><Plus className="w-3.5 h-3.5" /></button>
                          </div>
                        </div>
                      ))
                    )
                  ) : (
                    <div className="space-y-4">
                      <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl space-y-2">
                        <div className="flex justify-between items-center text-xs font-bold text-amber-600">
                          <span>Voucher Penukaran Poin</span>
                          <button onClick={() => setShowVoucherSelector(!showVoucherSelector)} className="text-[#0B8F5A]">{showVoucherSelector ? 'Tutup' : 'Pilih Voucher'}</button>
                        </div>
                        {selectedVoucher ? (
                          <div className="flex justify-between items-center"><p className="text-xs font-bold text-slate-800 dark:text-slate-200">{selectedVoucher.name} (-Rp {discountAmount.toLocaleString('id-ID')})</p><button onClick={() => setSelectedVoucher(null)} className="text-rose-500 text-[10px] font-bold">Batal</button></div>
                        ) : <p className="text-[11px] text-slate-400">Belum ada voucher dipasang.</p>}
                        {showVoucherSelector && (
                          <div className="space-y-2 pt-2 border-t">
                            {(!currentUser || !currentUser.myVouchers || currentUser.myVouchers.length === 0) ? (
                              <p className="text-[11px] text-slate-400 italic">Anda belum memiliki voucher.</p>
                            ) : (
                              <div className="space-y-1 max-h-36 overflow-y-auto">
                                {currentUser.myVouchers.map(v => (
                                  <div key={v.id} onClick={() => { setSelectedVoucher(v); setShowVoucherSelector(false); }} className="p-2 bg-white dark:bg-slate-800 rounded-xl text-xs font-bold cursor-pointer flex justify-between items-center border">
                                    <div><span className="block">{v.name}</span><span className="text-[9px] text-slate-400">Rp {(v.discountAmount || 0).toLocaleString('id-ID')} OFF</span></div>
                                    <span className="text-[#0B8F5A] bg-emerald-50 px-2 py-0.5 rounded text-[10px]">Gunakan</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border space-y-2">
                        <span className="text-xs font-bold uppercase text-slate-500 block mb-1">Rincian Harga</span>
                        <div className="flex justify-between text-xs"><span className="text-slate-500">Subtotal</span><span className="font-bold">Rp {subtotalCart.toLocaleString('id-ID')}</span></div>
                        {discountAmount > 0 && <div className="flex justify-between text-xs text-emerald-600"><span>Diskon ({selectedVoucher?.name})</span><span className="font-bold">-Rp {discountAmount.toLocaleString('id-ID')}</span></div>}
                        <div className="border-t pt-2 flex justify-between items-center"><span className="text-xs font-bold">Total Bayar</span><span className="text-xl font-black text-[#0B8F5A]">Rp {finalTotalAmount.toLocaleString('id-ID')}</span></div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-4 border-t space-y-2">
                    {checkoutStep === 'cart' ? (
                      <button onClick={() => setCheckoutStep('payment')} className="w-full bg-[#0B8F5A] text-white py-3.5 rounded-xl font-bold text-sm">Lanjut ke Pembayaran</button>
                    ) : (
                      <button onClick={handleProcessCheckout} className="w-full bg-amber-500 text-slate-900 py-3.5 rounded-xl font-extrabold text-sm">Konfirmasi Pesanan</button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL STRUK DIGITAL */}
          {activeOrderReceipt && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
                <button onClick={() => setActiveOrderReceipt(null)} className="absolute top-4 right-4 text-slate-400"><X className="w-5 h-5" /></button>
                <div className="w-12 h-12 bg-emerald-100 text-[#0B8F5A] rounded-full flex items-center justify-center mx-auto"><Check className="w-6 h-6" /></div>
                <h3 className="font-bold text-lg">Struk Digital Pesanan</h3>
                <span className="font-mono font-black text-amber-600 text-xs block">{activeOrderReceipt.orderNo}</span>
                <div className="p-4 bg-white border-2 border-dashed rounded-2xl mx-auto w-48 h-48 flex flex-col items-center justify-center shadow-inner">
                  <QrCode size={120} className="text-slate-900" />
                  <span className="text-[9px] font-mono font-bold text-slate-500 mt-2 truncate w-full">{activeOrderReceipt.qrReceiptCode}</span>
                </div>
                <p className="text-xs text-slate-500">Pindai QR ini untuk klaim <span className="font-bold text-[#0B8F5A]">+{activeOrderReceipt.pointsEarned} Poin</span>.</p>
                <button onClick={() => { handleClaimQR(activeOrderReceipt.qrReceiptCode); setActiveOrderReceipt(null); }} className="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow text-xs flex items-center justify-center gap-2"><QrCode className="w-4 h-4" /> Klaim Poin Struk Ini Now</button>
              </div>
            </div>
          )}

          {/* MODAL SCANNER QR MANUAL */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border rounded-3xl max-w-sm w-full p-6 space-y-4 text-center shadow-2xl relative">
                <button onClick={() => setQrModalOpen(false)} className="absolute top-4 right-4 text-slate-400"><X className="w-5 h-5" /></button>
                <QrCode className="w-10 h-10 text-[#0B8F5A] mx-auto" />
                <h3 className="font-bold text-lg">Scan / Input Kode QR Struk</h3>
                <p className="text-xs text-slate-500">Ketikkan kode QR unik dari struk belanja Anda untuk menambah poin.</p>
                <input type="text" value={scanQRInput} onChange={(e) => setScanQRInput(e.target.value)} placeholder="QR-POINT-RS-123456..." className="w-full bg-slate-50 dark:bg-slate-800 border p-3 rounded-xl text-xs font-mono outline-none" />
                <button onClick={() => handleClaimQR()} className="w-full bg-[#0B8F5A] text-white font-bold py-3 rounded-xl shadow text-xs">Proses Klaim Poin</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
